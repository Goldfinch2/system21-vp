; Cyber Sled for VectorPie: the package manifest (see the SDK's docs/07-packages.md)
id           = cybersled_emu
name         = Cyber Sled Emulator
manufacturer = Namco
executable   = cybersled_emu
version      = 1.0.1
sdk          = 0.1
description  = Tank duels in an arena - the original game's code, its 3D world in vectors (needs MAME's cybsled.zip)
hiscores     = no
marquee      = marquee.png

[system21]                       ; which System 21 game this package is (src/profile.cpp)
game         = cybsled           ; MAME's set, cybsled.zip
[dvg]                            ; the USB-DVG
frame_hz     = 30                ; frames a second
[beamforge]
frame_hz     = 50
