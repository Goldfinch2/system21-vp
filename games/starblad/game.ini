; Star Blade for VectorPie: the package manifest (see the SDK's docs/07-packages.md)
id           = starblade_emu
name         = Starblade Emulator
manufacturer = Namco
executable   = starblade_emu
version      = 1.0.6
sdk          = 0.1
description  = Space shooter on rails - the original game's code, its 3D world in vectors (needs MAME's starblad.zip)
hiscores     = no
marquee      = marquee.png

[system21]                       ; which System 21 game this package is (src/profile.cpp)
game         = starblad          ; MAME's set, starblad.zip
[dvg]                            ; the USB-DVG
frame_hz     = 30                ; frames a second
[beamforge]
frame_hz     = 50
